# .streamlit/config.toml
# Dark "screening room" theme. Setting it here (rather than only in the app's
# CSS) is what makes Streamlit's own widgets — sliders, dropdowns, dataframes,
# tooltips — pick up the palette instead of falling back to the red/white
# defaults and clashing with the page.
[theme]
base = "dark"
primaryColor = "#E3A857"
backgroundColor = "#0F1216"
secondaryBackgroundColor = "#171C24"
textColor = "#ECEEF1"
font = "sans serif"

[server]
headless = true
